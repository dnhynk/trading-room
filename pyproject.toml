[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-room"
version = "0.1.0"
description = "Track A/A-2 rotation, Track B campaign trading, and Track C liquidity recovery"
requires-python = ">=3.12"
dependencies = ["websockets==17.1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
charts = ["matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "track_a*", "track_b*", "track_c*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
track_a_2 = ["config.json"]
track_c = ["config.json"]
